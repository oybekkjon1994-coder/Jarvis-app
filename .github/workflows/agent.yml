name: Jarvis agent
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python agent/agent.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Holatni saqlash
        run: |
          git config user.name "jarvis-agent"
          git config user.email "agent@users.noreply.github.com"
          git add agent/state.json
          git diff --cached --quiet || (git commit -m "agent: holat yangilandi" && git push)
